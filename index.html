<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: fixed sidebar (drawer under 900px) + sticky top bar + one scrolling content column.
   One green accent on warm-neutral greys; colour elsewhere is reserved for order status. */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --surface-2:#F8F9F5; --line:#E2E5DC;
  --fg:#1D211B; --muted:#596056; --accent:#2F5233; --accent-fg:#FFFFFF; --accent-soft:#E9F0E6;
  --bar:#C9D3C4; --bad:#8F1F1F; --shadow:rgba(20,30,18,.16);
  --st-pending-bg:#FFF1CF; --st-pending-fg:#6B4A00;
  --st-processing-bg:#E4ECFB; --st-processing-fg:#1F3F8F;
  --st-shipping-bg:#EAE5F8; --st-shipping-fg:#4B2F9E;
  --st-done-bg:#DEF1E1; --st-done-fg:#1E5B2A;
  --st-cancelled-bg:#F8DEDE; --st-cancelled-fg:#8F1F1F;
  --font-body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Noto Serif Bengali','Hind Siliguri',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121410; --surface:#1B1E19; --surface-2:#21251F; --line:#2D3129;
    --fg:#ECEAE3; --muted:#A8A497; --accent:#8FBF8A; --accent-fg:#11210F; --accent-soft:#263326;
    --bar:#3D4A3B; --bad:#F2A9A9; --shadow:rgba(0,0,0,.5);
    --st-pending-bg:#3A3015; --st-pending-fg:#F2D88A;
    --st-processing-bg:#1B2A45; --st-processing-fg:#A9C2F2;
    --st-shipping-bg:#2C2547; --st-shipping-fg:#C7B8F2;
    --st-done-bg:#1A3321; --st-done-fg:#9ADBA8;
    --st-cancelled-bg:#3E1D1D; --st-cancelled-fg:#F2A9A9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121410; --surface:#1B1E19; --surface-2:#21251F; --line:#2D3129;
  --fg:#ECEAE3; --muted:#A8A497; --accent:#8FBF8A; --accent-fg:#11210F; --accent-soft:#263326;
  --bar:#3D4A3B; --bad:#F2A9A9; --shadow:rgba(0,0,0,.5);
  --st-pending-bg:#3A3015; --st-pending-fg:#F2D88A;
  --st-processing-bg:#1B2A45; --st-processing-fg:#A9C2F2;
  --st-shipping-bg:#2C2547; --st-shipping-fg:#C7B8F2;
  --st-done-bg:#1A3321; --st-done-fg:#9ADBA8;
  --st-cancelled-bg:#3E1D1D; --st-cancelled-fg:#F2A9A9;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:flex;align-items:stretch;min-height:100%}
.sb{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{display:block;font-family:var(--font-display);font-size:24px;line-height:1.15;color:var(--accent)}
.brand span{display:block;font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;font-size:16px;font-weight:600}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .lbl{flex:1}
.badge{min-width:22px;padding:0 7px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:12px;font-weight:700;text-align:center;line-height:22px}
.sb .site{margin-top:auto;display:flex;align-items:center;justify-content:center;min-height:44px;border:1.5px solid var(--line);border-radius:12px;font-weight:600}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45)}
.mainc{flex:1 1 0;min-width:0}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(clamp(14px,3vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(14px,3vw,32px),env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.iconbtn{position:relative;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.hamb{display:none}
.topbrand{display:none;align-items:center;gap:8px;min-height:44px}
.topbrand b{display:block;font-family:var(--font-display);font-size:21px;line-height:1.1;color:var(--accent)}
.topbrand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--muted)}
.search{flex:1 1 180px;max-width:460px;position:relative}
.search .ico{position:absolute;left:14px;top:12px;width:18px;height:18px;color:var(--muted)}
.search input{width:100%;min-height:44px;padding:0 14px 0 42px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
.spacer{flex:1}
.notifwrap{position:relative}
.notifwrap .badge{position:absolute;top:-6px;right:-6px;line-height:20px;min-width:20px;padding:0 5px}
.pop{position:absolute;right:0;top:52px;width:min(340px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;z-index:50}
.pop b{font-weight:700}
.pop a{display:block;min-height:44px;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.me{display:flex;align-items:center;gap:10px;padding-left:4px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.me small{display:block;font-size:12px;color:var(--muted)}

.content{padding-block:clamp(16px,3vw,32px);padding-left:max(clamp(16px,3vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,32px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.pagehead h1{font-family:var(--font-display);font-size:clamp(26px,3.4vw,34px);line-height:1.3}
.muted{color:var(--muted)}
.note{padding:10px 14px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--muted)}
.note strong{color:var(--fg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card h2{font-size:19px}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.stat{display:flex;gap:14px;align-items:flex-start}
.stat .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.stat .k{font-size:14px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.3;font-variant-numeric:tabular-nums}
.stat .d{font-size:13px;color:var(--muted)}
.stat .d.up{color:var(--accent)}
.stat .d.down{color:var(--bad)}
.row2{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.row2 > .wide{flex:2 1 460px}
.row2 > .narrow{flex:1 1 300px}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;border:1px solid var(--line)}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#chart{margin-top:14px;width:100%}
#chart svg{display:block;max-width:100%}
.ax{fill:var(--muted);font:12px var(--font-body)}
.axb{fill:var(--fg);font:700 12px var(--font-body)}
.grid{stroke:var(--line);stroke-width:1;fill:none}
.bar{fill:var(--bar)}
.bar.today{fill:var(--accent)}

.tw{overflow-x:auto}
.tr{display:grid;gap:12px;align-items:center;padding:10px 22px;border-top:1px solid var(--line);min-height:58px}
.tr.th{background:var(--surface-2);border-top:0;min-height:0;font-size:13px;font-weight:600;color:var(--muted);padding-block:10px}
.tr.sel{background:var(--accent-soft)}
.t-recent .tr{grid-template-columns:84px minmax(140px,1.2fr) minmax(160px,1.3fr) 100px 140px;min-width:680px}
.t-orders .tr{grid-template-columns:84px minmax(150px,1.3fr) minmax(170px,1.5fr) 110px 140px 100px;min-width:760px}
.t-cust .tr{grid-template-columns:minmax(160px,1.4fr) minmax(140px,1.2fr) 100px 120px 120px;min-width:660px}
.tr small{display:block;font-size:13px;color:var(--muted)}
.tr b{font-weight:600}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.st-pending{background:var(--st-pending-bg);color:var(--st-pending-fg)}
.st-processing{background:var(--st-processing-bg);color:var(--st-processing-fg)}
.st-shipping{background:var(--st-shipping-bg);color:var(--st-shipping-fg)}
.st-done{background:var(--st-done-bg);color:var(--st-done-fg)}
.st-cancelled{background:var(--st-cancelled-bg);color:var(--st-cancelled-fg)}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:600}
.btn:hover{background:var(--accent-soft)}
.btn.solid{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.solid:hover{opacity:.9}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border:0;color:var(--muted);text-decoration:underline}
.btn.sq{min-width:48px;padding:0;border-radius:12px;border-color:var(--line);color:var(--fg);font-size:20px}
.btn.rect{border-radius:12px}

.tops{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.tops .l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.tops .l span:first-child{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.meter{margin-top:6px;height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.lowrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills button{min-height:44px;padding:0 16px;border:1.5px solid var(--accent);border-radius:999px;background:transparent;color:var(--accent);font-weight:600}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.split > .list{flex:1 1 560px;min-width:0}
.split > .detail{flex:1 1 320px;max-width:420px;display:flex;flex-direction:column;gap:14px}
.detail .lines{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.detail .lines div{display:flex;justify-content:space-between;gap:10px}
.detail .total{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px}
.detail .actions{display:flex;flex-direction:column;gap:8px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .nm{display:flex;align-items:center;gap:10px}
.pcard .stock{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1.2}
.ctl{display:flex;flex-wrap:wrap;gap:8px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-weight:600;font-size:14px}
.field input{min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.field small{font-size:13px;color:var(--muted)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px}
.swrow small{display:block;font-size:13px;color:var(--muted)}
.sw{flex:none;width:56px;height:44px;padding:0;border:0;background:none;display:flex;align-items:center}
.sw i{display:flex;align-items:center;width:52px;height:30px;padding:0 3px;border-radius:999px;background:var(--bar)}
.sw i b{display:block;width:24px;height:24px;border-radius:50%;background:var(--surface)}
.sw[aria-checked="true"] i{background:var(--accent);justify-content:flex-end}
.sw[aria-checked="true"] i b{background:var(--accent-fg)}

@media (max-width:900px){
  .sb{position:fixed;top:0;left:0;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 40px var(--shadow);padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-left:max(14px,env(safe-area-inset-left,0px));overflow-y:auto}
  .sb.open{transform:none}
  .hamb{display:inline-flex}
  .topbrand{display:flex}
  .me .who{display:none}
}
@media (max-width:600px){.search{order:9;flex:1 1 100%;max-width:none}.spacer{display:none}.me{margin-left:auto}}
@media (prefers-reduced-motion:reduce){.sb{transition:none}}
</style>

</div>

<script>

    var s = String(Math.round(n));

  };
  var PIDS = ['jbij', 'kola', 'nil', 'jaba', 'anaros', 'falis'];
  var ST = {

    });
    var rows = Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.spend - a.spend; }).map(function (c) {
      return '<div class="tr"><span><b>' + esc(c.name) + '</b><small>' + c.phone + '</small></span><span>' + esc(c.area) + '</span><span>' + bn(c.count) + 'টি</span><b>' + tk(c.spend) + '</b><span><span class="pill ' + (c.count > 1 ? 'st-done' : 'st-processing') + '">' + (c.count > 1 ? 'নিয়মিত' : 'নতুন') + '</span></span></div>';
    }).join('');
    return '<section class="card flush t-cust"><div class="tw"><div class="tr th"><span>গ্রাহক</span><span>এলাকা</span><span>অর্ডার</span><span>মোট খরচ</span><span>ধরন</span></div>' + rows + '</div></section>';
  }

  function sw(label, hint, on, key) {
    return '<div class="swrow"><div><b>' + label + '</b><small>' + hint + '</small></div><button type="button" class="sw" role="switch" aria-checked="' + on + '" aria-label="' + label + '" data-act="sw" data-k="' + key + '"><i><b></b></i></button></div>';
  }
  function viewPrefs() {
    return '<div class="sgrid">' +
      '<section class="card"><h2>প্রোফাইল</h2><div class="field"><label for="s-name">অ্যাডমিনের নাম</label><input id="s-name" type="text" value="' + esc(S.adminName) + '"><small>উপরের বারে এই নাম দেখানো হয়।</small></div></section>' +
      '<section class="card"><h2>চেহারা ও নোটিফিকেশন</h2>' + sw('ডার্ক মোড', 'রাতে চোখের আরামের জন্য গাঢ় থিম', isDark(), 'dark') + sw('নতুন অর্ডারের নোটিফিকেশন', 'নতুন অর্ডার এলে বেল আইকনে দেখাবে', S.notifNew, 'notifNew') + sw('কম স্টকের নোটিফিকেশন', 'স্টক সীমার নিচে নামলে জানাবে', S.notifLow, 'notifLow') + '</section>' +
      '<section class="card"><h2>স্টক সীমা</h2><div class="field"><label for="s-low">কত পিসের নিচে "কম স্টক" দেখাবে</label><input id="s-low" type="number" min="0" value="' + S.low + '" inputmode="numeric"><small>ড্যাশবোর্ডের কম স্টক তালিকা ও নোটিফিকেশনে এটি প্রযোজ্য হয়।</small></div></section></div>';
  }

  /* ---------- chart ---------- */
  function drawChart() {
    var el = document.getElementById('chart');
    if (!el) return;
    var D = derive(), isSales = S.chartMode === 'sales';
    var W = Math.max(280, el.clientWidth || 600), H = 260, pl = W < 420 ? 44 : 56, pr = 8, pt = 22, pb = 30;
    var vals = DAYS.map(function (_, i) { return isSales ? dayLive(D, i) : D.live.filter(function (o) { return o.d === i; }).length; });
    var max = Math.max.apply(null, vals.concat([1]));
    var raw4 = max / 4, pow = Math.pow(10, Math.floor(Math.log(raw4) / Math.LN10)), step = pow, mult = [1, 2, 2.5, 5, 10];
    for (var m = 0; m < mult.length; m++) { if (mult[m] * pow >= raw4) { step = mult[m] * pow; break; } }
    var top = step * 4, pw = W - pl - pr, ph = H - pt - pb, slot = pw / 7, bw = Math.min(44, slot * 0.58);
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (isSales ? 'গত ৭ দিনের দৈনিক বিক্রি' : 'গত ৭ দিনের দৈনিক অর্ডার সংখ্যা') + '">';
    for (var t = 0; t <= 4; t++) {
      var y = pt + ph - ph * t / 4;
      s += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text class="ax" x="' + (pl - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + num(step * t) + '</text>';
    }
    vals.forEach(function (v, i) {
      var h = ph * v / top, x = pl + slot * i + (slot - bw) / 2, yy = pt + ph - h, td = i === 6;
      s += '<rect class="bar' + (td ? ' today' : '') + '" x="' + x + '" y="' + yy + '" width="' + bw + '" height="' + Math.max(h, 0) + '" rx="4"><title>' + DATE[i] + ': ' + (isSales ? tk(v) : bn(v) + 'টি অর্ডার') + '</title></rect>';
      s += '<text class="' + (td ? 'axb' : 'ax') + '" x="' + (x + bw / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + DAYS[i] + '</text>';
      if (td) s += '<text class="axb" x="' + Math.min(x + bw / 2, W - pr - 2) + '" y="' + (yy - 6) + '" text-anchor="' + (x + bw / 2 > W - 40 ? 'end' : 'middle') + '">' + (isSales ? tk(v) : bn(v)) + '</text>';
    });
    el.innerHTML = s + '</svg>';
  }

  /* ---------- theme ---------- */
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function setTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem('nisarga-admin-theme', dark ? 'dark' : 'light'); } catch (e) {}
  }
  try { var saved = localStorage.getItem('nisarga-admin-theme'); if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved); } catch (e) {}

  /* ---------- chrome + render ---------- */
  function notifs(D) {
    var list = [];
    if (S.notifNew && D.newCount > 0) list.push({ text: bn(D.newCount) + 'টি নতুন অর্ডার নিশ্চিত করার অপেক্ষায়', href: '#orders', f: 'new' });
    if (S.notifLow) D.lowList.forEach(function (p) { list.push({ text: PROD[p].name + ': স্টকে মাত্র ' + bn(S.stock[p]) + ' পিস', href: '#products', f: '' }); });
    return list;
  }
  function chrome(D) {
    var nav = Object.keys(NAVLBL).map(function (k) {
      return '<a href="#' + k + '"' + (S.tab === k ? ' aria-current="page"' : '') + '>' + ico(TABS[k][2]) + '<span class="lbl">' + NAVLBL[k] + '</span>' + (k === 'orders' && D.newCount > 0 ? '<span class="badge">' + bn(D.newCount) + '</span>' : '') + '</a>';
    }).join('');
    document.getElementById('nav').innerHTML = nav;
    var n = notifs(D), nb = document.getElementById('notifbadge');
    nb.hidden = n.length === 0; nb.textContent = bn(n.length);
    var pop = document.getElementById('pop');
    pop.hidden = !S.notifOpen;
    document.getElementById('notifbtn').setAttribute('aria-expanded', String(S.notifOpen));
    pop.innerHTML = '<b>নোটিফিকেশন</b>' + (n.length ? n.map(function (a) { return '<a href="' + a.href + '" data-act="notif-go" data-f="' + a.f + '">' + a.text + '</a>'; }).join('') : '<p class="muted" style="font-size:14px">নতুন কোনো নোটিফিকেশন নেই।</p>');
    document.getElementById('avatar').textContent = (S.adminName.trim() || 'অ').charAt(0);
    document.getElementById('adminname').textContent = S.adminName.trim() || 'অ্যাডমিন';
    var dark = isDark();
    document.getElementById('themepath').setAttribute('d', dark ? 'M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6l1.4 1.4 M17 17l1.4 1.4 M5.6 18.4L7 17 M17 7l1.4-1.4 M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z' : 'M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z');
    document.getElementById('themebtn').setAttribute('aria-label', dark ? 'লাইট মোডে যান' : 'ডার্ক মোডে যান');
    document.getElementById('sb').classList.toggle('open', S.menuOpen);
    document.getElementById('scrim').hidden = !S.menuOpen;
  }
  function render() {
    var D = derive();
    chrome(D);
    var info = TABS[S.tab];
    var body = S.tab === 'dashboard' ? viewDashboard(D) : S.tab === 'orders' ? viewOrders(D) : S.tab === 'products' ? viewProducts(D) : S.tab === 'customers' ? viewCustomers(D) : viewPrefs();
    document.getElementById('view').innerHTML =
      '<div class="pagehead"><div><h1>' + info[0] + '</h1><p class="muted">' + info[1] + '</p></div><div class="muted" style="font-size:14px">বৃহস্পতিবার, ২৬ নভেম্বর ২০২৬</div></div>' +
      '<p class="note"><strong>নমুনা ডেটা:</strong> অর্ডার, গ্রাহক, স্টক ও বিক্রির সংখ্যা সবই উদাহরণ। স্ট্যাটাস, স্টক বা সেটিংস বদলালে পরিবর্তন শুধু এই পেইজ খোলা থাকা পর্যন্ত থাকে।</p>' + body;
    document.title = info[0] + ' · নিসর্গ অ্যাডমিন';
    drawChart();
  }
  function route() {
    var h = location.hash.replace('#', '');
    S.tab = TABS[h] ? h : 'dashboard';
    S.menuOpen = false; S.notifOpen = false;
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  function setStatus(id, status) { S.orders.forEach(function (o) { if (o.id === id) o.status = status; }); }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) {
      if (S.notifOpen && !e.target.closest('.notifwrap')) { S.notifOpen = false; render(); }
      return;
    }
    var a = t.getAttribute('data-act');
    if (a === 'menu-open') { S.menuOpen = true; render(); }
    else if (a === 'notif') { S.notifOpen = !S.notifOpen; render(); }
    else if (a === 'notif-go') { S.filter = t.getAttribute('data-f') || 'all'; S.sel = ''; S.notifOpen = false; }
    else if (a === 'all-orders') { S.filter = 'all'; S.q = ''; document.getElementById('gq').value = ''; S.sel = ''; }
    else if (a === 'theme') { setTheme(!isDark()); render(); }
    else if (a === 'chart') { S.chartMode = t.getAttribute('data-mode'); render(); }
    else if (a === 'filter') { S.filter = t.getAttribute('data-f'); render(); }
    else if (a === 'open') { S.sel = t.getAttribute('data-id'); render(); }
    else if (a === 'closesel') { S.sel = ''; render(); }
    else if (a === 'advance') { var id = t.getAttribute('data-id'); S.orders.forEach(function (o) { if (o.id === id && ST[o.status].next) o.status = ST[o.status].next; }); render(); }
    else if (a === 'cancel') { setStatus(t.getAttribute('data-id'), 'cancelled'); render(); }
    else if (a === 'stock') { var p = t.getAttribute('data-p'); S.stock[p] = Math.max(0, S.stock[p] + parseInt(t.getAttribute('data-d'), 10)); render(); }
    else if (a === 'sw') {
      var k = t.getAttribute('data-k');
      if (k === 'dark') setTheme(!isDark()); else S[k] = !S[k];
      render();
    }
  });
  document.getElementById('scrim').addEventListener('click', function () { S.menuOpen = false; render(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (S.menuOpen || S.notifOpen)) { S.menuOpen = false; S.notifOpen = false; render(); } });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'gq') {
      S.q = e.target.value; S.filter = 'all'; S.sel = '';
      if (S.tab !== 'orders') { location.hash = 'orders'; } else { render(); }
    } else if (id === 's-name') {
      S.adminName = e.target.value; chrome(derive());
    } else if (id === 's-low') {
      var v = parseInt(e.target.value, 10); S.low = isNaN(v) ? 0 : Math.max(0, v); chrome(derive());
    }
  });
  window.addEventListener('hashchange', route);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawChart, 120); });
  route();
})();
</script>

</body></html>
